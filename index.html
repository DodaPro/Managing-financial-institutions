    <!-- Data & Application Logic -->
    <script>
        // --- Data Definitions ---

        const tfQuestions = [
            { id: 1, text: "التخطيط المالي يقوم برفع كفاءة الأداء المالي وتحقيق الأهداف بصورة اقتصادية", ans: false, exp: "خطأ، التنظيم المالي هو الذي يعني رفع كفاءة الأداء المالي، بينما التخطيط يعني الاستعداد للمستقبل.", hint: "تذكر الفرق بين التنظيم والتخطيط في وظائف الإدارة المالية." },
            { id: 2, text: "التنظيم المالي يعني التهيؤ والاستعداد للمستقبل", ans: false, exp: "خطأ، التخطيط المالي هو الذي يعني التهيؤ والاستعداد للمستقبل.", hint: "عكس السؤال السابق تماماً." },
            { id: 3, text: "الرقابة المالية لا يحقق التخطيط المالي أهدافه ما لم يكن قد اقترن بنظام رقابي فعال", ans: true, exp: "إجابة صحيحة، الرقابة جزء مكمل للتخطيط لضمان تحقيق الأهداف وتقييم القرارات.", hint: "هل يكتمل التخطيط بدون متابعة ورقابة؟" },
            { id: 4, text: "من خصائص الوسطاء الماليين ارتفاع نسبه صافي حقوق الملكية لاجمالي مصادر الاموال الخاصه بالوسطاء الماليين، بينما يتمثل الشطر الصغير من تلك المصادر في التزامات ماليه، وذلك على عكس قطاع الاعمال الذي يعتمد بصفه اساسيه على صافي حق الملكية ولا تمثل الالتزامات الماليه الا نسبه قليله من المصادر", ans: false, exp: "خطأ، من خصائصهم (انخفاض) نسبة صافي حقوق الملكية واعتمادهم الأكبر على الالتزامات (الودائع).", hint: "تذكر أن البنوك تعتمد بشكل أساسي على أموال المودعين وليس أموالها الخاصة." },
            { id: 5, text: "ليست هناك خصائص معينه تميز الوسطاء الماليين عن غيرهم من المنشأت الاخرى التي تعمل في قطاع الاعمال", ans: false, exp: "خطأ، بل يتميزون بخصائص واضحة كارتفاع نسبة الأصول المالية وانخفاض حقوق الملكية.", hint: "طبيعة عمل الوسطاء تختلف جذرياً عن الشركات الصناعية والتجارية." },
            { id: 6, text: "تصنيف المؤسسات الماليه الى مجموعتين هما مؤسسات مالية تتلقي الودائع ومؤسسات مالية لا تتلقي الودائع", ans: false, exp: "خطأ، التصنيف الأساسي هو: مؤسسات تقوم بدور الوساطة، ومؤسسات لا تقوم بدور الوساطة. (ثم تُقسم مؤسسات الوساطة إلى تقبل ولا تقبل ودائع).", hint: "ركز على التقسيم الرئيسي الأول للمؤسسات." },
            { id: 7, text: "ينحصر دور المؤسسات المالية في تعبئة وتجميع المدخرات وتمويل القطاعات الاقتصادية المختلفه فقط", ans: false, exp: "خطأ، لا ينحصر دورها في ذلك فقط، بل يشمل الاستثمار المباشر، تنفيذ برامج التمويل، وتنشيط الصناعات.", hint: "كلمة 'فقط' غالباً ما تجعل العبارة خاطئة في الوظائف المتعددة." },
            { id: 8, text: "تتركز اساليب التمويل في البنوك الاسلامية في منح القروض بانواعها المختلفه للعملاء", ans: false, exp: "خطأ، البنوك الإسلامية لا تمنح قروضاً بفائدة، بل تعتمد على صيغ التمويل الإسلامي كالمضاربة والمرابحة.", hint: "كيف تعمل البنوك الإسلامية مقارنة بالتجارية؟" },
            { id: 9, text: "يتركز دور البنوك التجارية في تلقي الودائع ومنح القروض والاستثمار في الاوراق الماليه فقط", ans: false, exp: "خطأ، هناك أنشطة فرعية كبيع وشراء النقد، إصدار بطاقات الائتمان، وتأجير الخزائن.", hint: "هل تقدم البنوك التجارية خدمات أخرى كبطاقات الائتمان؟" },
            { id: 10, text: "تقدم البنوك المتخصصه الائتمان قصير الاجل لكافه القطاعات الاقتصاديه دون تفرقه مثلها مثل البنوك التجارية", ans: false, exp: "خطأ، البنوك المتخصصة (كالزراعية والصناعية) تقدم غالباً تمويلاً طويل ومتوسط الأجل لقطاع محدد.", hint: "اسمها 'متخصصة' لأنها تركز على قطاعات محددة وبآجال معينة." },
            { id: 11, text: "السيوله في البنوك التجارية اخطر من السيولة في المشروعات التجارية", ans: true, exp: "إجابة صحيحة، لأن البنك يعتمد على أموال المودعين الذين قد يسحبونها في أي وقت.", hint: "ماذا يحدث لو ذهب جميع المودعين لسحب أموالهم فجأة؟" },
            { id: 12, text: "ليس هناك فرق بين اساليب التمويل في البنوك الاسلامية واساليب التمويل في البنوك التجارية", ans: false, exp: "خطأ، يوجد فرق جوهري، التجارية تعتمد على الفائدة، والإسلامية على المشاركة والمرابحة.", hint: "البنوك الإسلامية ترفض الفائدة وتعتمد آليات أخرى." },
            { id: 13, text: "نسبه الاحتياطى القانوني عباره عن الاموال التي تحتفظ بها البنوك التجارية لديها.", ans: false, exp: "خطأ، نسبة الاحتياطي القانوني تحتفظ بها البنوك لدى (البنك المركزي) وليس لديها.", hint: "أين تضع البنوك الاحتياطي القانوني؟" },
            { id: 14, text: "ان ارصده البنوك لدى البنك المركزى في اطار النسب القانونية تستحق فائده بالاسعار السائدة", ans: false, exp: "خطأ، الأرصدة كاحتياطي قانوني لدى المركزي لا تدر فائدة للبنك التجاري.", hint: "الاحتياطي القانوني غرضه الأمان وليس الاستثمار المربح." },
            { id: 15, text: "تعتبر كل الاوراق التجارية المخصومه اصولا سائله من وجهه نظر البنك", ans: false, exp: "خطأ، فقط الأوراق التجارية المخصومة لأقل من 3 شهور تعتبر أصولاً سائلة (التزامات مؤكدة سريعة).", hint: "تذكر مدة الاستحقاق لتصنيف الأصل كسائل." },
            { id: 16, text: "تعرف الاصول السائله بانها الاصول الصعب تحويلها الى نقديه بسرعه وبدون تحمل خسائر", ans: false, exp: "خطأ، الأصول السائلة هي التي (يسهل) تحويلها إلى نقدية بسرعة وبدون خسائر.", hint: "عكس التعريف الصحيح تماماً." },
            { id: 17, text: "تتركز المتطلبات التشريعية الخاصة بضبط السيوله في نسبه الاحتياطي القانوني والمفروض من البنك المركزي", ans: false, exp: "خطأ، هناك نسبة السيولة القانونية (30%) بجانب الاحتياطي القانوني.", hint: "هل الاحتياطي القانوني هو النسبة الوحيدة المطلوبة؟" },
            { id: 18, text: "هناك ثلاث وسائل يمكن للبنك التجارى اللجوء اليها لمقابله احتياجات السيولة", ans: false, exp: "خطأ، هناك وسيلتين أساسيتين: إدارة الأصول (تسييلها) وإدارة الالتزامات (اقتراض جديد).", hint: "راجع المحاضرة، تم ذكر وسيلتين رئيسيتين فقط." },
            { id: 19, text: "ليس هناك فرق بين المفاهيم المختلفه للسيوله فكلها تعكس قابلية تحول الاصول الى نقدية", ans: false, exp: "خطأ، هناك فرق؛ المفهوم المطلق، المفهوم الفني، والمفهوم النسبي.", hint: "يوجد أكثر من منظور وتعريف للسيولة في البنوك." },
            { id: 20, text: "تتركز مصادر الدخل الرئيسية في البنك في العائد من القروض", ans: false, exp: "خطأ، هناك عوائد أخرى كالاستثمارات المالية وإيرادات الخدمات المصرفية، ورغم أهمية القروض فهي ليست المصدر الوحيد للدخل الرئيسي دائماً حسب تنوع البنك.", hint: "ماذا عن الأوراق المالية والعمولات؟" },
            { id: 21, text: "لا يمكن احتساب نسبه الاحتياطى القانوني دون بيانات الارباح والخسائر الخاصه بالبنك", ans: false, exp: "خطأ، نسبة الاحتياطي تحسب من بيانات (الميزانية العمومية) كالأرصدة لدى المركزي والودائع، ولا تحتاج حساب الأرباح.", hint: "الاحتياطي يعتمد على الودائع، أين توجد الودائع؟" },
            { id: 22, text: "ليس هناك فرق بين الاصول السائله والاصول الايراديه فكلاهما اصول تمثل استخدامات للاموال في البنوك التجارية", ans: false, exp: "خطأ، الأصول السائلة غرضها مواجهة السحب (مثل النقدية ولا تدر عائداً كبيراً)، الأصول الإيرادية غرضها الربح (كالقروض).", hint: "النقدية أصل سائل لكنها غير إيرادية." },
            { id: 23, text: "لا يمكن حساب الربحيه الكليه للبنك دون بيانات الارصده لدى البنك المركزي", ans: false, exp: "خطأ، الربحية (كالعائد على حقوق الملكية) تعتمد على صافي الربح والملكية، ولا تتطلب رقم الأرصدة لدى المركزي بشكل مباشر في قوانينها.", hint: "راجع قوانين الربحية الأربعة." },
            { id: 24, text: "تتعرض المؤسسات الماليه المصرفيه لنوعين فقط من المخاطر", ans: false, exp: "خطأ، تتعرض لعدة مخاطر: مخاطر ائتمان، سيولة، سوق، معدل فائدة وغيرها.", hint: "بيئة البنوك مليئة بأنواع كثيرة جداً من المخاطر." },
            { id: 25, text: "تعتبر صناديق الاستثمار من الوسطاء الماليين", ans: true, exp: "إجابة صحيحة، صناديق الاستثمار تعتبر من المؤسسات التي تقوم بدور الوساطة ولا تتلقى ودائع.", hint: "هي وسيط بين المستثمر وسوق الأوراق المالية." },
            { id: 26, text: "تنحصر عناصر عقد التامين في المؤمن والمؤمن له (صاحب الوثيقه) فقط", ans: false, exp: "خطأ، قد يوجد طرف ثالث وهو (المستفيد) إذا لم يكن هو نفسه المؤمن له.", hint: "ماذا لو أمن شخص على حياته لصالح أبنائه؟" },
            { id: 27, text: "يقصد بمبدأ التعويض قيام المؤمن بتعويض المؤمن له من كل الخسائر التي لحقت به مهما بلغت قيمتها", ans: false, exp: "خطأ، التعويض يكون في حدود (مبلغ التأمين) وقيمة الشيء المؤمن عليه، وليس مطلقاً.", hint: "هل تعوض الشركة بأكثر من قيمة الشيء الفعلي؟" },
            { id: 28, text: "يقضى شرط النسبيه في التامين بتحمل المؤمن كل الخسائر طالما كانت في حدود مبلغ التامين", ans: false, exp: "خطأ، شرط النسبية يعني أن المؤمن له يتحمل جزءاً من الخسارة إذا كان مبلغ التأمين أقل من قيمة الشيء الفعلية وقت الخسارة.", hint: "النسبية تعني تقسيم الخسارة إذا كان التأمين دون الكفاية." },
            { id: 29, text: "هناك شروط معينه يجب توافرها في وثيقه التامين حتى يمكن تطبيق مبدأ المشاركة", ans: true, exp: "إجابة صحيحة، مبدأ المشاركة (تعدد المؤمنين) له شروط محددة لتوزيع الخسارة بينهم.", hint: "لا يتم تطبيق المشاركة إلا وفق قواعد محددة بالوثائق." },
            { id: 30, text: "يتركز الشطر الاعظم من مصادر الاموال في شركات التامين في مصادر التمويل قصيرة الأجل مثلها مثل البنوك التجاريه", ans: false, exp: "خطأ، أموال التأمين (كالتأمين على الحياة) تكون طويلة الأجل غالباً عكس ودائع البنوك التجارية القصيرة الأجل.", hint: "وثائق التأمين عادة تستمر لسنوات طويلة." },
            { id: 31, text: "تقوم شركات التامين العامه بكل انواع التامين مثل الممتلكات وتامينات المسئوليه المدنيه والتامين على الحياه", ans: false, exp: "خطأ، شركات التأمين العامة تختص بالممتلكات والمسؤولية، وهناك شركات منفصلة للتأمين على الحياة.", hint: "التأمين على الحياة له قطاع أو شركات مخصصة." },
            { id: 32, text: "تعنى عمليه التامين التزام المؤمن بدفع التعويض للمؤمن له او المستفيد في اى وقت يراه المؤمن له مناسبا له", ans: false, exp: "خطأ، التعويض يُدفع عند (وقوع الخطر المؤمن منه) وليس في أي وقت يختاره المؤمن له.", hint: "التأمين مرتبط بوقوع الخطر." },
            { id: 33, text: "تمويل الأصول يشمل فقط الأصول الثابتة", ans: false, exp: "خطأ، تمويل الأصول يشمل الأصول الثابتة (كالمعدات) والمتداولة (كالمخزون).", hint: "المخزون والسيولة أصول تحتاج لتمويل أيضاً." },
            { id: 34, text: "الأرباح المحتجزة مصدر خارجي", ans: false, exp: "خطأ، الأرباح المحتجزة هي مصدر تمويل (داخلي) من داخل أرباح المنشأة.", hint: "تأتي من أرباح الشركة السابقة وليست من ديون." },
            { id: 35, text: "الإيجار التمويلي يوفر السيولة", ans: true, exp: "إجابة صحيحة، لأنه يغنيك عن دفع ثمن الأصل كاملاً دفعة واحدة مما يوفر سيولة المنشأة.", hint: "بدلاً من الدفع الفوري، تدفع أقساطاً." },
            { id: 36, text: "تمويل المتداولة بمصادر طويلة الأجل مناسب", ans: false, exp: "خطأ، الأصول المتداولة (قصيرة الأجل) الأنسب لها تمويل (قصير الأجل) لتحقيق التوازن.", hint: "القصير يُمول بالقصير، والطويل يُمول بالطويل." },
            { id: 37, text: "تكلفة الاقتراض دائما أعلى من العائد", ans: false, exp: "خطأ، بل يجب أن يكون العائد المتوقع من الاستثمار أعلى من تكلفة الاقتراض، وإلا خسر المشروع.", hint: "لو التكلفة أعلى، لن تقترض الشركة أساساً." },
            { id: 38, text: "التمويل الذاتي يزيد المخاطر", ans: false, exp: "خطأ، التمويل الذاتي (الاعتماد على أموال المنشأة) يخفض المخاطر المالية لأنه يقلل الاعتماد على الديون.", hint: "الديون هي التي تزيد المخاطر." },
            { id: 39, text: "معايير الاختيار تشمل التكلفة", ans: true, exp: "إجابة صحيحة، تكلفة التمويل هي المعيار الأهم عند اختيار مصدر الأموال.", hint: "تبحث دائماً عن التمويل الأقل تكلفة." },

        const mcqQuestions = [

            { id: 6, text: "مخاطر الائتمان تعني", opts: ["أ) تقلب أسعار الأسهم", "ب) عدم قدرة المقترض على السداد", "ج) تغير سعر الصرف", "د) ارتفاع تكاليف الإنتاج"], correct: 1, exp: "خطر الائتمان هو تعثر العميل وعدم سداده لأصل القرض أو الفوائد في موعدها.", hint: "الائتمان يعني السلف أو القرض." },
            { id: 7, text: "البورصة تساهم في:", opts: ["أ) زيادة التضخم", "ب) تجميد رؤوس الأموال", "ج) جذب الاستثمارات وتنشيط التداول", "د) إلغاء الوساطة المالية"], correct: 2, exp: "سوق الأوراق المالية (البورصة) يوفر السيولة ويشجع الاستثمار وتحويل المدخرات لتمويل.", hint: "كيف تساعد البورصة الشركات في الحصول على أموال؟" },
            { id: 8, text: "من أهداف الإدارة المالية:", opts: ["أ) السيولة", "ب) تحقيق الاستقرار المالي", "ج) الإنتاج", "د) الاستثمار"], correct: 1, exp: "الاستقرار المالي يضمن توازن الهيكل المالي واستمرار الشركة في السوق.", hint: "الهدف الذي يحمي الشركة من الإفلاس." },
            { id: 9, text: "والنظام المالي يساعد في:", opts: ["أ) تعطيل المدخرات", "ب) تخصيص الموارد بكفاءة", "ج) تقليل الاستثمارات", "د) منع التداول"], correct: 1, exp: "توجيه الأموال من وحدات الفائض إلى وحدات العجز يعتبر تخصيصاً كفؤاً للموارد.", hint: "نقل المال لمن يحتاجه للإنتاج." },

            { id: 11, text: "من أهم نواحي القصور في التحليل المالي أنه يعتمد على:", opts: ["أ) البيانات المستقبلية", "ب) البيانات التاريخية", "ج) البيانات النوعية", "د) التوقعات الاقتصادية"], correct: 1, exp: "القوائم المالية تعكس أحداثاً ماضية (تاريخية) قد لا تكون مؤشراً دقيقاً للمستقبل.", hint: "الأرقام المحاسبية تسجل ما حدث فعلاً في الماضي." },
            { id: 12, text: "يرجع القصور في المقارنة بين البنوك إلى اختلاف:", opts: ["أ) حجم الفروع", "ب) السياسات المحاسبية", "ج) عدد العملاء", "د) أساليب التسويق"], correct: 1, exp: "اختلاف طرق الإهلاك وتقييم المخزون والمخصصات (السياسات المحاسبية) يجعل المقارنة مضللة أحياناً.", hint: "كيف يحسب كل بنك أرباحه وأصوله؟" },

            { id: 15, text: "من أوجه القصور في الاعتماد على النسب المالية فقط:", opts: ["أ) تجاهل التدفقات النقدية", "ب) زيادة دقة النتائج", "ج) سهولة المقارنة", "د) تحسين القرار المالي"], correct: 0, exp: "النسب تعتمد على الاستحقاق المحاسبي وقد تتجاهل التدفقات النقدية الفعلية ومخاطر السيولة الحقيقية.", hint: "الربح الدفتري لا يعني وجود نقدية بالخزينة." },
            { id: 16, text: "يختلف التحليل المالي للبنوك التجارية عن الاستثمارية بسبب اختلاف:", opts: ["أ) السياسات النقدية", "ب) طبيعة النشاط وحجم المؤسسة", "ج) السياسة الائتمانية", "د) تعليمات البنك المركزي"], correct: 1, exp: "نشاط البنك التجاري (إقراض/ودائع قصيرة) يختلف جذرياً عن الاستثماري (أسواق مالية وشركات).", hint: "ماذا يبيع ويشتري كل بنك؟" },
            { id: 17, text: "يتأثر التحليل المالي بنتائج:", opts: ["أ) البيئة الاقتصادية العامة", "ب) البيئة القانونية فقط", "ج) البيئة الداخلية فقط", "د) العوامل الشخصية"], correct: 0, exp: "حالة الركود أو الانتعاش الاقتصادي تنعكس مباشرة على نتائج ومؤشرات البنك.", hint: "المناخ العام للسوق يؤثر على كل شيء." },
            { id: 18, text: "من وسائل الحد من نواحي القصور في التحليل المالي:", opts: ["أ) تجاهل التحليل المالي", "ب) الاعتماد على النسب فقط", "ج) استخدام التحليل التنبؤي", "د) إلغاء القوائم المالية"], correct: 2, exp: "يجب دعم البيانات التاريخية بتحليلات تنبؤية للمستقبل وموازنات تقديرية.", hint: "النظر للمستقبل بدلاً من الاعتماد الكلي على الماضي." },
            { id: 19, text: "يهدف دمج العوامل غير المالية مع التحليل المالي إلى:", opts: ["أ) زيادة تعقيد التحليل", "ب) تقليل المخاطر", "ج) تحسين جودة القرار المالي", "د) إلغاء التحليل التقليدي"], correct: 2, exp: "الرؤية الشاملة (مالية + غير مالية) تعطي تقييماً أدق وتصنع قراراً أفضل.", hint: "أخذ الصورة كاملة يجعل القرار أكثر صواباً." },
            { id: 20, text: "من نتائج تجاهل نواحي القصور في التحليل المالي:", opts: ["أ) قرارات مالية رشيدة", "ب) استقرار مالي أكبر", "ج) قرارات مالية غير دقيقة", "د) زيادة كفاءة التحليل"], correct: 2, exp: "الاعتماد الأعمى على الأرقام دون إدراك عيوبها يؤدي لاتخاذ قرارات خاطئة.", hint: "إذا اعتمدت على أداة بها عيب دون أن تنتبه، ماذا ستكون النتيجة؟" },
            { id: 21, text: "يقصد بالدورة النقدية:", opts: ["أ) دورة الإنتاج", "ب) حركة النقد داخل المؤسسة", "ج) دورة رأس المال", "د) دورة المخزون"], correct: 1, exp: "الدورة النقدية (Cash Cycle) تتبع مسار النقد من خروجه لشراء المدخلات حتى عودته من المبيعات.", hint: "دخول وخروج السيولة." },
            { id: 22, text: "من التدفقات النقدية الداخلة:", opts: ["أ) سداد القروض", "ب) منح القروض", "ج) تحصيل الأقساط", "د) المصروفات الإدارية"], correct: 2, exp: "التحصيل يمثل نقداً يدخل لخزينة البنك/المؤسسة.", hint: "فلوس تدخل الخزنة." },
            { id: 23, text: "تهدف إدارة الدورة النقدية إلى", opts: ["أ) تعظيم المخاطر", "ب) تحقيق التوازن بين السيولة والربحية", "ج) زيادة المصروفات", "د) تقليل الإيرادات"], correct: 1, exp: "الهدف دائماً هو عدم تعطيل النقد (ربحية) وتوفيره وقت الحاجة (سيولة).", hint: "المعادلة الذهبية للإدارة المالية." },

            { id: 25, text: "تؤثر سياسة الائتمان على", opts: ["أ) الدورة النقدية", "ب) الهيكل الإداري", "ج) عدد الفروع", "د) الموارد البشرية"], correct: 0, exp: "تسهيل الائتمان (البيع الآجل) يطيل الدورة النقدية ويؤخر التدفقات الداخلة.", hint: "فترات السداد والتحصيل تؤثر على ماذا؟" },
            { id: 26, text: "يمثل الفرق بين التدفقات الداخلة والخارجة", opts: ["أ) رأس المال", "ب) صافي التدفق النقدي", "ج) الأرباح", "د) الاحتياطيات"], correct: 1, exp: "المقبوضات - المدفوعات = صافي التدفق النقدي (Cash Flow).", hint: "الناتج الصافي لحركة الأموال." },
            { id: 27, text: "من مخاطر الدورة النقدية:", opts: ["أ) مخاطر السيولة", "ب) مخاطر التسويق", "ج) مخاطر الإنتاج", "د) المخاطر البيئية"], correct: 0, exp: "طول الدورة النقدية يعرض المؤسسة لخطر نقص السيولة وعدم القدرة على السداد.", hint: "خطر مرتبط بنقص الأموال السائلة." },
            { id: 28, text: "الإفراط في السيولة يؤدي إلى", opts: ["أ) زيادة الربحية", "ب) انخفاض الربحية", "ج) انعدام المخاطر", "د) زيادة التكاليف الثابتة"], correct: 1, exp: "تعطيل الأموال كسيولة عاطلة يحرم المؤسسة من استثمارها، مما يقلل العائد والربحية.", hint: "الفلوس المركونة لا تأتي بأرباح." },
            { id: 29, text: "تبدأ الدورة النقدية عادةً بـ:", opts: ["أ) تحصيل الأقساط", "ب) الحصول على النقدية", "ج) سداد الالتزامات", "د) إعادة التوظيف"], correct: 1, exp: "تبدأ بتوفير أو الحصول على النقدية من مصادر التمويل لضخها في الأصول والأنشطة.", hint: "أول خطوة هي توفير المال اللازم." },
            { id: 30, text: "تعد الدورة النقدية مؤشرًا على", opts: ["أ) كفاءة الإدارة النقدية", "ب) عدد العملاء", "ج) حجم المؤسسة", "د) الهيكل التنظيمي"], correct: 0, exp: "قصر الدورة يشير إلى كفاءة الإدارة في التحصيل وإدارة النقد.", hint: "مدى براعة المدير المالي." },
            { id: 31, text: "الهدف الأساسي لبيان التدفق النقدي هو:", opts: ["أ) قياس الربحية", "ب) قياس السيولة", "ج) قياس الإنتاج", "د) قياس المبيعات"], correct: 1, exp: "القائمة توضح المقبوضات والمدفوعات الفعلية، وهي المقياس الأدق للسيولة.", hint: "يُركز على (النقدية)." },
            { id: 32, text: "أي من التالي يُضاف عند إعداد التدفق النقدي بالطريقة غير المباشرة؟", opts: ["أ) زيادة الخصوم", "ب) الإهلاك", "ج) شراء معدات", "د) سداد قرض"], correct: 1, exp: "الإهلاك مصروف غير نقدي، يُخصم للوصول لصافي الدخل، لذا يُضاف مرة أخرى للوصول للتدفق النقدي.", hint: "مصروف دفتري لا تخرج بسببه نقود حقيقية." },
            { id: 33, text: "زيادة الدائنين تؤدي إلى:", opts: ["أ) نقص النقدية", "ب) عدم التأثير", "ج) زيادة النقدية", "د) انخفاض الربح"], correct: 2, exp: "زيادة الدائنين تعني أن المؤسسة احتفظت بنقديتها ولم تسددها فوراً (بمثابة مصدر تدفق موجب).", hint: "تأخير دفع الموردين يحافظ على الكاش معك." },
            { id: 34, text: "شراء أوراق مالية طويلة الأجل يُصنف ضمن:", opts: ["أ) أنشطة تشغيلية", "ب) أنشطة تمويلية", "ج) أنشطة استثمارية", "د) أنشطة إدارية"], correct: 2, exp: "شراء وبيع الأصول الطويلة الأجل والاستثمارات يندرج تحت الأنشطة الاستثمارية.", hint: "شراء أصل للاستثمار." },
            { id: 35, text: "توزيع الأرباح النقدية يُعد:", opts: ["أ) نشاطًا تشغيليًا", "ب) نشاطًا تمويليًا", "ج) نشاطًا استثماريًا", "د) إيرادا"], correct: 1, exp: "توزيع الأرباح يعتبر عائداً مقدم لمقدمي التمويل (المساهمين)، لذا يصنف نشاط تمويلي.", hint: "دفع أموال للمُلاك." },
            { id: 36, text: "المعادلة الصحيحة لبيان التدفق النقدي هي:", opts: ["أ) الربح = الإيرادات – المصروفات", "ب) النقدية = الأصول - الخصوم", "ج) صافي التغير في النقدية = تشغيلية + استثمارية + تمويلية", "د) رأس المال العامل = النقدية فقط"], correct: 2, exp: "القائمة تجمع صافي التدفقات من الأنشطة التشغيلية، الاستثمارية، والتمويلية.", hint: "مجموع الأقسام الثلاثة للقائمة." },
            { id: 37, text: "الطريقة المباشرة تعتمد على:", opts: ["أ) صافي الربح", "ب) المقبوضات والمدفوعات الفعلية", "ج) الإهلاك", "د) رأس المال"], correct: 1, exp: "الطريقة المباشرة تحسب النقد المقبوض من العملاء والنقد المدفوع للموردين بشكل مباشر.", hint: "تحسب الداخل والخارج صراحة." },
            { id: 38, text: "إذا زادت الذمم المدينة بمبلغ 100,000 جنيه فإنها:", opts: ["أ) تُضاف للتدفق", "ب) تُخصم من التدفق", "ج) لا تؤثر", "د) تزيد الربح فقط"], correct: 1, exp: "زيادة الذمم تعني أموالاً لم يتم تحصيلها بعد، فَتُخصم من صافي الدخل في الطريقة غير المباشرة.", hint: "فلوس لك عند الناس ولم تأخذها." },
            { id: 39, text: "التدفق التشغيلي الموجب يشير إلى:", opts: ["أ) ضعف النشاط", "ب) كفاءة النشاط الأساسي", "ج) ارتفاع الديون", "د) خسارة محاسبية"], correct: 1, exp: "دليل على أن نشاط الشركة اليومي قادر على توليد نقدية كافية لتغطية التكاليف.", hint: "نجاح صميم عمل الشركة." },
            { id: 40, text: "الفرق بين الربح والتدفق النقدي يرجع أساسا إلى:", opts: ["أ) تغير أسعار الفائدة", "ب) أساس الاستحقاق", "ج) التضخم", "د) حجم البنك"], correct: 1, exp: "الربح يحسب بأساس الاستحقاق (إيراد ومصروف يخص السنة)، بينما التدفق يحسب بالأساس النقدي (المقبوض والمدفوع فعلاً).", hint: "المبدأ المحاسبي المتبع في قائمة الدخل." },

            { id: 51, text: "معيار اختيار التمويل ؟", opts: ["أ) عدد موظفين", "ب) تكلفة", "ج) لون الأصول", "د) طقس."], correct: 1, exp: "تكلفة التمويل هي المعيار الأهم؛ فلا بد أن يكون العائد من استثمار الأموال أعلى من تكلفتها.", hint: "ما يهم المستثمر هو حساب المصروفات والفوائد." },
            { id: 52, text: "أثر التمويل غير الرشيد؟", opts: ["أ) ربحية", "ب) مخاطر", "ج) سيولة", "د) نمو."], correct: 1, exp: "الاعتماد الخاطئ على الديون بكثافة أو التمويل غير المتوازن يعرض الشركة لمخاطر العجز عن السداد.", hint: "كثرة الديون الخاطئة تؤدي إلى الإفلاس." },

            { id: 55, text: "اقتراض مناسب إذا ؟", opts: ["أ) العائد أعلى من التكلفة", "ب) التكلفة أعلى من العائد", "ج) بدون سداد", "د) قصير."], correct: 0, exp: "الاقتراض يكون مجدياً اقتصادياً فقط إذا كان العائد المتوقع من المشروع يتجاوز فائدة وتكلفة القرض.", hint: "لو كسبت 15% ودفعت للبنك 10%، هذا استثمار مناسب." },

        const essayQuestions = [
            { id: 1, q: "1. اذكر مفهوم ووظائف الادارة المالية", a: "<b>مُلخص:</b> توفير الأموال اللازمة واستخدامها الأمثل لتحقيق أهداف الشركة، وتشمل وظائفها الأساسية: التخطيط (التهيؤ للمستقبل)، التنظيم (رفع كفاءة الأداء)، والرقابة المالية (المتابعة وتقييم القرارات)." },
            { id: 2, q: "2. اذكر مفهوم طبيعة المؤسسات المالية", a: "<b>مُلخص:</b> هي منظمات تختلف عن غيرها بكون منتجاتها 'أصولاً مالية' بدلاً من السلع الحقيقية، وتعتمد بشكل هائل على أموال المودعين (الغير) مقارنة بحقوق ملكيتها المنخفضة." },
            { id: 3, q: "3. عرف البنوك التجارية مع ذكر انشطتها", a: "<b>مُلخص:</b> مصارف تقبل الودائع وتمنح القروض. <b>أنشطتها:</b> أساسية (تلقي ودائع، قروض، استثمار أوراق مالية)، وفرعية (بيع عملات، تحصيل شيكات، بطاقات ائتمان، وتأجير خزائن)." },
            { id: 4, q: "4. اذكر وظائف المؤسسات المالية التي تقوم بدور الوساطة المالية", a: "<b>مُلخص:</b> تجميع المدخرات، تسهيل التمويل بكونها حلقة وصل، التوفيق بين آجال المودعين والمقترضين، توفير معلومات متخصصة، وتقليل المخاطر عبر التنويع." },
            { id: 5, q: "5. ما هي انواع شركات التامين", a: "<b>مُلخص:</b> تنقسم إلى 3 أنواع رئيسية: شركات تأمين عامة (للممتلكات والمسؤولية)، شركات تأمين على الحياة، وشركات إعادة التأمين." },
            { id: 6, q: "6. قارن بين تمويل الأصول الثابتة والمتداولة.", a: "<b>مُلخص:</b> الأصول الثابتة (طويلة الأجل كالمباني) تمول بمصادر طويلة لتناسب عمرها وتوسعاتها. والأصول المتداولة (قصيرة كالمخزون) تمول بمصادر قصيرة لدعم التشغيل اليومي." },
            { id: 7, q: "7. ما مصادر التمويل وكيف تختار؟", a: "<b>مُلخص:</b> المصادر: داخلية (أرباح محتجزة) أو خارجية (قروض/أسهم). ويُختار المصدر بشرط أساسي: أن يكون العائد المتوقع من الاستثمار (أكبر) من تكلفة الحصول على التمويل." },
            { id: 8, q: "8. ناقش الإيجار التمويلي كأداة.", a: "<b>مُلخص:</b> هو استئجار أصل (كمعدات باهظة) مقابل دفعات دورية لينتهي بتملكه؛ ميزته الكبرى توفير السيولة، وعيبه تحمل تكلفة فوائد إضافية." },
            { id: 9, q: "9. وكيف يؤثر التمويل على الأداء؟", a: "<b>مُلخص:</b> التمويل الرشيد والمتوازن يحسن الربحية والسيولة، بينما التمويل الخاطئ (كزيادة الديون بشكل مفرط) يعرض الشركة لمخاطر العجز والإفلاس." },
            { id: 10, q: "10. اذكر الوسائل التي يمكن للبنك التجارى اللجوء اليها لمقابله احتياجات السيولة", a: "<b>مُلخص:</b> وسيلتين أساسيتين: 1) إدارة الأصول: عبر بيع (تسييل) الأصول السائلة السريعة كأذون الخزانة. 2) إدارة الالتزامات: عبر اقتراض أموال جديدة أو إصدار شهادات إيداع." },
            { id: 11, q: "11. اذكر انواع المؤسسات المالية", a: "<b>مُلخص:</b> أ) مؤسسات وساطة (منها ما يقبل ودائع كالبنوك التجارية، ومنها لا يقبل كشركات التأمين). ب) مؤسسات لا تقوم بالوساطة (كسماسرة وتجار الأوراق المالية)." },
            { 
                id: 12, 
                q: `<b>مثال 1: فيما يلي القوائم الماليه لاحد البنوك التجارية في 2025/12/31 بملايين الجنيهات</b>
                    <br><br><h4 class='font-bold text-center mb-2'>ميزانية عمومية</h4>
                    <div class="overflow-x-auto"><table class="w-full text-sm text-center border-collapse border border-gray-300 mb-4">
                        <thead>
                            <tr class="bg-blue-100"><th class="border p-2 border-gray-300">الالتزامات وحقوق الملكية</th><th class="border p-2 border-gray-300">الاصول</th></tr>
                        </thead>
                        <tbody>
                            <tr><td class="border p-2 border-gray-300">12 حق الملكية</td><td class="border p-2 border-gray-300">39 نقديه وارصده لدى البنك المركزي</td></tr>
                            <tr><td class="border p-2 border-gray-300">130 الودائع</td><td class="border p-2 border-gray-300">57 ارصده لدى البنوك الاخرى</td></tr>
                            <tr><td class="border p-2 border-gray-300">40 ارصده مستحقه للبنوك</td><td class="border p-2 border-gray-300">88 قروض وسلفيات</td></tr>
                            <tr><td class="border p-2 border-gray-300">11 ارصده دائنه اخرى<br>3 ارباح العام المنتهى</td><td class="border p-2 border-gray-300">12 اسهم وسندات</td></tr>
                            <tr class="font-bold bg-gray-50"><td class="border p-2 border-gray-300">127 اجمالى الالتزامات وحقوق الملكية</td><td class="border p-2 border-gray-300">196 اجمالى الاصول</td></tr>
                        </tbody>
                    </table></div>
                    <h4 class='font-bold text-center mb-2'>حساب الارباح والخسائر</h4>
                    <div class="overflow-x-auto"><table class="w-full text-sm text-center border-collapse border border-gray-300 mb-4">
                        <thead>
                            <tr class="bg-blue-100"><th class="border p-2 border-gray-300">له</th><th class="border p-2 border-gray-300">منه</th></tr>
                        </thead>
                        <tbody>
                            <tr><td class="border p-2 border-gray-300">14 فوائد محصله</td><td class="border p-2 border-gray-300">11 فوائد مدفوعه</td></tr>
                            <tr><td class="border p-2 border-gray-300">4 عائد خدمات مصرفيه</td><td class="border p-2 border-gray-300">4 مصروفات عمومية وادارية</td></tr>
                            <tr><td class="border p-2 border-gray-300">1 ایرادات اخرى</td><td class="border p-2 border-gray-300">1 اهلاكات<br>3 صافي الربح</td></tr>
                            <tr class="font-bold bg-gray-50"><td class="border p-2 border-gray-300">19 الاجمالي</td><td class="border p-2 border-gray-300">19 الاجمالي</td></tr>
                        </tbody>
                    </table></div>
                    <b>المطلوب:</b>
                    <ul class="list-disc list-inside mt-2">
                        <li>حساب هامش سعر الفائده</li>
                        <li>انتشار سعر الفائده</li>
                        <li>صافي الاعباء الثابته</li>
                        <li>ربحية البنك</li>
                    </ul>`, 
                a: `<b>الحل النموذجي:</b><br><br>
                    <b>أ- هامش سعر الفائده</b> = ((الفوائد المحصله - الفوائد المدفوعه) / اجمالي الاصول الايراديه) × 100<br>
                    = ((14 - 11) / (12 + 88 + 57)) × 100 = (3 / 157) × 100 = <b>1.91%</b> (ملاحظة: في المحاضرة تم التقريب إلى 3% بفرض الأصول الإيرادية 100)<br><br>
                    <b>ب- انتشار سعر الفائدة</b> = (معدل العائد على الاصول الايرادية) - (معدل تكلفه الاموال)<br>
                    = [(الفوائد المحصله / الاصول الايرادية) × 100] - [(الفوائد المدفوعه / الودائع) × 100]<br>
                    = [(14 / 157) × 100] - [(11 / 130) × 100] = 8.92% - 8.46% = <b>0.46%</b><br><br>
                    <b>ت- صافي الاعباء الثابته</b> = [(عائد الخدمات المصرفيه واى ايرادات اخرى) - مصروفات ادارية وعمومية] / اجمالى الاصول × 100<br>
                    = [(4 + 1) - 4] / 196 × 100 = (1 / 196) × 100 = <b>0.51%</b><br><br>
                    <b>ث- قياس ربحيه البنك:</b><br>
                    1. <b>معدل العائد على حقوق الملكية</b> = [ارباح العام المنتهي (صافي الربح)] / [حقوق الملكية + (0.5 × ارباح العام المنتهى)] × 100<br>
                       = 3 / [12 + (0.5 × 3)] × 100 = 3 / 13.5 × 100 = <b>22.2%</b><br>
                    2. <b>معدل العائد على اجمالى الموارد المتاحه</b> = صافي الربح / (حق الملكية المعدل + الودائع) × 100<br>
                       = 3 / (13.5 + 130) × 100 = 3 / 143.5 × 100 = <b>2.1%</b><br>
                    3. <b>معدل العائد على الاصول</b> = صافي الربح / اجمالي الاصول × 100<br>
                       = 3 / 196 × 100 = <b>1.5%</b><br>
                    4. <b>معدل التوزيعات المدفوعه</b> = اجمالي التوزيعات / صافي الربح × 100 = 0 / 3 × 100 = <b>0%</b>` 
            },
            { 
                id: 13, 
                q: `<b>مثال 2: شركات التأمين (شرط النسبية)</b><br>
                    أمن احد رجال الاعمال ضد السرقه على بضائع قيمتها 100,000 جنيه لدى ثلاث مؤمنين:
                    <ul class="list-disc list-inside mt-2 mb-2">
                        <li>فأمن لدى المؤمن <b>أ</b> بمبلغ 25,000 جم</li>
                        <li>ولدى المؤمن <b>ب</b> بمبلغ 20,000 جم</li>
                        <li>ولدى المؤمن <b>ج</b> بمبلغ 35,000 جم</li>
                    </ul>
                    <b>المطلوب:</b> حساب ما يدفعه كل مؤمن وما يتحمله المومن له علما بان الوثيقه تتضمن شرط النسبيه وذلك في الحالات الاتيه:<br>
                    أ - سرقه ما قيمته 40,000 جنيه من المخزون<br>
                    ب - سرقه ما قيمته 90,000 جنيه من المخزون`, 
                a: `<b>الحل النموذجي:</b><br>
                    بضائع = 100,000 جم<br>
                    مبالغ التأمين = 25,000 (أ) + 20,000 (ب) + 35,000 (ج) = <b>80,000 جم</b> (إجمالي التأمين)<br>
                    بما أن التأمين أقل من القيمة، يطبق شرط النسبية.<br><br>
                    <b>الحالة (أ): سرقه ما قيمته 40,000 جم من المخزن</b><br>
                    التعويض = الخسائر الفعلية × (مبلغ التامين / قيمة الشئ المؤمن عليه)<br>
                    - ما يدفعه المؤمن <b>أ</b> = 40,000 × (25,000 / 100,000) = <b>10,000 جم</b><br>
                    - ما يدفعه المؤمن <b>ب</b> = 40,000 × (20,000 / 100,000) = <b>8,000 جم</b><br>
                    - ما يدفعه المؤمن <b>ج</b> = 40,000 × (35,000 / 100,000) = <b>14,000 جم</b><br>
                    * اجمالي التعويض = 10,000 + 8,000 + 14,000 = <b>32,000 جم</b><br>
                    * ما يتحمله المؤمن له = قيمة الخسائر الفعلية - اجمالي التعويض = 40,000 - 32,000 = <b>8,000 جم</b><br><br>
                    
                    <b>الحالة (ب): سرقه ما قيمته 90,000 من المخزون</b><br>
                    - ما يدفعه المؤمن <b>أ</b> = 90,000 × (25,000 / 100,000) = <b>22,500 جم</b><br>
                    - ما يدفعه المؤمن <b>ب</b> = 90,000 × (20,000 / 100,000) = <b>18,000 جم</b><br>
                    - ما يدفعه المؤمن <b>ج</b> = 90,000 × (35,000 / 100,000) = <b>31,500 جم</b><br>
                    * اجمالي التعويض = 22,500 + 18,000 + 31,500 = <b>72,000 جم</b><br>

                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">نسبة التداول =</span>
                            <span class="frac"><span class="num">الأصول المتداولة</span><span class="den">الخصوم المتداولة</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">نسبة السيولة السريعة =</span>
                            <span class="frac"><span class="num">الأصول المتداولة - المخزون - المصروفات المقدمة</span><span class="den">الخصوم المتداولة</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">نسبة النقدية للشركات =</span>
                            <span class="frac"><span class="num">النقدية</span><span class="den">الخصوم المتداولة</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">معدل دوران الأصول =</span>
                            <span class="frac"><span class="num">صافي المبيعات</span><span class="den">إجمالي الأصول</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">معدل دوران الأصول الثابتة =</span>
                            <span class="frac"><span class="num">صافي المبيعات</span><span class="den">صافي الأصول الثابتة</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">معدل دوران المخزون =</span>
                            <span class="frac"><span class="num">تكلفة البضاعة المباعة</span><span class="den">متوسط المخزون</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">معدل دوران الذمم (المدينين) =</span>
                            <span class="frac"><span class="num">صافي المبيعات الآجلة</span><span class="den">متوسط رصيد الذمم</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">متوسط فترة التحصيل =</span>
                            <span class="frac"><span class="num">365 (أو عدد أيام السنة)</span><span class="den">معدل دوران الذمم</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">نسبة الاقتراض (الديون للأصول) =</span>
                            <span class="frac"><span class="num">إجمالي الديون (طويلة وقصيرة)</span><span class="den">إجمالي الأصول</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">نسبة الديون إلى حقوق الملكية =</span>
                            <span class="frac"><span class="num">إجمالي الديون</span><span class="den">إجمالي حقوق الملكية</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">نسبة تغطية الفوائد =</span>
                            <span class="frac"><span class="num">الربح قبل الفوائد والضرائب</span><span class="den">الفوائد</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">نسبة مجمل الربح =</span>
                            <span class="frac"><span class="num">مجمل الربح (المبيعات - التكلفة)</span><span class="den">صافي المبيعات</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">نسبة صافي الربح =</span>
                            <span class="frac"><span class="num">صافي الدخل بعد الضريبة</span><span class="den">صافي المبيعات</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">العائد على الأصول =</span>
                            <span class="frac"><span class="num">الربح قبل الفوائد والضرائب</span><span class="den">إجمالي الأصول</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">معدل العائد على الاستثمار =</span>
                            <span class="frac"><span class="num">صافي الربح</span><span class="den">إجمالي الأصول</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">العائد على حقوق الملاك =</span>
                            <span class="frac"><span class="num">صافي الدخل</span><span class="den">متوسط حقوق الملاك</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">عائد السهم الواحد =</span>
                            <span class="frac"><span class="num">صافي الدخل بعد الزكاة والضريبة</span><span class="den">عدد الأسهم العادية</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-emerald-800">نسبة القيمة السوقية للعائد =</span>
                            <span class="frac"><span class="num">القيمة السوقية للسهم</span><span class="den">عائد السهم الواحد</span></span>
                        </div>
                    </div>
                </div>

                <!-- 6. قوانين شركات التأمين -->
                <div class="bg-red-50 p-5 rounded-xl border border-red-200 shadow-sm">
                    <h3 class="text-xl font-bold text-red-900 mb-4 border-b-2 border-red-300 pb-2">6. قوانين حساب التعويض في شركات التأمين</h3>
                    <div class="grid grid-cols-1 gap-4">
                        <div class="formula-card">
                            <span class="font-bold text-red-800">التعويض (بشرط النسبية) =</span>
                            <span>الخسائر الفعلية</span>
                            <span class="font-bold">×</span>
                            <span class="frac"><span class="num">مبلغ التأمين</span><span class="den">قيمة الشيء المؤمن عليه</span></span>
                        </div>
                        <div class="formula-card">
                            <span class="font-bold text-red-800">التعويض (هلاك كلي / تعدد مؤمنين) =</span>
                            <span>الخسائر الفعلية</span>
                            <span class="font-bold">×</span>
                            <span class="frac"><span class="num">مبلغ التأمين لدى المؤمن</span><span class="den">مجموع مبالغ التأمين</span></span>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // --- State Management ---
        let state = JSON.parse(sessionStorage.getItem('financeQuizState')) || {
            tf: {},
            mcq: {},
            essay: {},
            score: 0,
            totalAnswered: 0
        };

        function saveState() {
            sessionStorage.setItem('financeQuizState', JSON.stringify(state));
            updateScoreDisplay();
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').textContent = `${state.score} / ${state.totalAnswered}`;
        }

        // --- UI Rendering ---

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'border-white');
                btn.classList.add('border-transparent');
            });
            document.getElementById(tabId).classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('bg-blue-600', 'border-white');
            document.getElementById(`tab-${tabId}`).classList.remove('border-transparent');
        }

        function toggleHint(elementId) {
            const hintEl = document.getElementById(elementId);
            hintEl.classList.toggle('show');
        }

        function renderTF() {
            const container = document.getElementById('tf');
            container.innerHTML = '<h2 class="text-2xl font-bold text-gray-800 border-b pb-2">أولاً: أسئلة صح أم خطأ</h2>';
            
            tfQuestions.forEach((q, index) => {
                const isAnswered = state.tf.hasOwnProperty(q.id);
                const userAns = state.tf[q.id];
                const isCorrect = userAns === q.ans;
                
                let btnTrueClass = "bg-white border-2 border-gray-300 hover:bg-gray-50 text-gray-700";
                let btnFalseClass = "bg-white border-2 border-gray-300 hover:bg-gray-50 text-gray-700";
                let expClass = "explanation-box text-sm mt-3 p-3 rounded-lg border ";

                if (isAnswered) {
                    if(q.ans === true) { btnTrueClass = "bg-green-500 text-white border-green-500"; }
                    if(q.ans === false) { btnFalseClass = "bg-green-500 text-white border-green-500"; }
                    
                    if(!isCorrect) {
                        if(userAns === true) btnTrueClass = "bg-red-500 text-white border-red-500";
                        if(userAns === false) btnFalseClass = "bg-red-500 text-white border-red-500";
                        expClass += "bg-red-50 text-red-800 border-red-200 show";
                    } else {
                        expClass += "bg-green-50 text-green-800 border-green-200 show";
                    }
                }

                container.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                        <div class="flex justify-between items-start gap-4">
                            <h3 class="text-lg font-semibold flex-1 leading-relaxed">${index + 1}. ${q.text}</h3>
                            <button onclick="toggleHint('hint-tf-${q.id}')" class="text-yellow-500 hover:text-yellow-600 bg-yellow-50 rounded-full p-2 text-xl" title="تلميح">💡</button>
                        </div>
                        <div id="hint-tf-${q.id}" class="hint-box text-sm bg-yellow-100 text-yellow-800 border border-yellow-300 p-3 rounded mt-2">
                            <strong>تلميح:</strong> ${q.hint}
                        </div>
                        <div class="flex gap-4 mt-4">
                            <button ${isAnswered ? 'disabled' : ''} onclick="handleTF(${q.id}, true)" class="option-btn flex-1 py-2 rounded-lg font-bold transition ${btnTrueClass}">صـح</button>
                            <button ${isAnswered ? 'disabled' : ''} onclick="handleTF(${q.id}, false)" class="option-btn flex-1 py-2 rounded-lg font-bold transition ${btnFalseClass}">خـطـأ</button>
                        </div>
                        <div class="${expClass} ${isAnswered ? 'block' : 'hidden'} mt-3">
                            <strong>ملاحظة/توضيح:</strong> ${q.exp}
                        </div>
                    </div>
                `;
            });
        }

        function handleTF(qId, choice) {
            if(state.tf.hasOwnProperty(qId)) return;
            const q = tfQuestions.find(x => x.id === qId);
            state.tf[qId] = choice;
            state.totalAnswered++;
            if(choice === q.ans) state.score++;
            saveState();
            renderTF();
        }

        function renderMCQ() {
            const container = document.getElementById('mcq');
            container.innerHTML = '<h2 class="text-2xl font-bold text-gray-800 border-b pb-2">ثانياً: أسئلة اختيار من متعدد</h2>';
            
            mcqQuestions.forEach((q, index) => {
                const isAnswered = state.mcq.hasOwnProperty(q.id);
                const userAns = state.mcq[q.id];
                const isCorrect = userAns === q.correct;
                
                let expClass = "explanation-box text-sm mt-3 p-3 rounded-lg border ";
                if (isAnswered) {
                     expClass += isCorrect ? "bg-green-50 text-green-800 border-green-200 show" : "bg-red-50 text-red-800 border-red-200 show";
                }

                let optionsHTML = '';
                q.opts.forEach((opt, optIndex) => {
                    let btnClass = "bg-white border border-gray-300 hover:bg-gray-50 text-gray-800";
                    if(isAnswered) {
                        if(optIndex === q.correct) btnClass = "bg-green-500 text-white border-green-500";
                        else if(optIndex === userAns && !isCorrect) btnClass = "bg-red-500 text-white border-red-500";
                    }
                    
                    optionsHTML += `
                        <button ${isAnswered ? 'disabled' : ''} onclick="handleMCQ(${q.id}, ${optIndex})" class="option-btn w-full text-right px-4 py-3 rounded-lg transition ${btnClass}">
                            ${opt}
                        </button>
                    `;
                });

                container.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                        <div class="flex justify-between items-start gap-4">
                            <h3 class="text-lg font-semibold flex-1 leading-relaxed">${index + 1}. ${q.text}</h3>
                            <button onclick="toggleHint('hint-mcq-${q.id}')" class="text-yellow-500 hover:text-yellow-600 bg-yellow-50 rounded-full p-2 text-xl" title="تلميح">💡</button>
                        </div>
                        <div id="hint-mcq-${q.id}" class="hint-box text-sm bg-yellow-100 text-yellow-800 border border-yellow-300 p-3 rounded mt-2">
                            <strong>تلميح:</strong> ${q.hint}
                        </div>
                        <div class="flex flex-col gap-2 mt-4">
                            ${optionsHTML}
                        </div>
                        <div class="${expClass} ${isAnswered ? 'block' : 'hidden'} mt-3">
                            <strong>ملاحظة/توضيح:</strong> ${q.exp}
                        </div>
                    </div>
                `;
            });
        }

        function handleMCQ(qId, choiceIndex) {
            if(state.mcq.hasOwnProperty(qId)) return;
            const q = mcqQuestions.find(x => x.id === qId);
            state.mcq[qId] = choiceIndex;
            state.totalAnswered++;
            if(choiceIndex === q.correct) state.score++;
            saveState();
            renderMCQ();
        }

        function renderEssay() {
            const container = document.getElementById('essay');
            container.innerHTML = '<h2 class="text-2xl font-bold text-gray-800 border-b pb-2">ثالثاً ورابعاً: الأسئلة المقالية والعملية</h2>';
            
            essayQuestions.forEach(q => {
                const isShown = state.essay[q.id] || false;
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                        <h3 class="text-lg font-bold text-blue-900 leading-relaxed mb-3">${q.q}</h3>
                        <button onclick="toggleEssay(${q.id})" class="text-sm bg-blue-100 hover:bg-blue-200 text-blue-800 font-semibold py-2 px-4 rounded transition">
                            ${isShown ? 'إخفاء الإجابة النموذجية 🙈' : 'إظهار الإجابة النموذجية 👁️'}
                        </button>
                        <div class="mt-4 p-4 bg-gray-50 border-r-4 border-blue-500 rounded text-gray-700 text-base leading-relaxed ${isShown ? 'block' : 'hidden'}">
                            ${q.a}
                        </div>
                    </div>
                `;
            });
        }

        function toggleEssay(qId) {
            state.essay[qId] = !state.essay[qId];
            saveState();
            renderEssay();
        }

        function renderFormulas() {
            document.getElementById('formulas').innerHTML = formulasHTML;
        }

        function resetProgress() {
            if(confirm("هل أنت متأكد من مسح جميع إجاباتك وإعادة البدء من جديد؟")) {
                sessionStorage.removeItem('financeQuizState');
                location.reload();
            }
        }

        // Initialize App
        updateScoreDisplay();
        renderTF();
        renderMCQ();
        renderEssay();
        renderFormulas();

    </script>
</body>
</html>
